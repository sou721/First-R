<!doctype html>

  <title>{% block title %}ケッペン気候区分クイズ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site">
    <a href="{{ url_for('index') }}" class="brand">🌏 ケッペン気候区分クイズ</a>
