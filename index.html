<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe6" />
  <title>わんこの気持ち</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>🐶 わんこの気持ち</h1>
      <p class="lead">犬の顔を撮影すると、AI がおおまかな感情を推定します。</p>
    </header>

    <section class="card capture">
      <div class="preview" id="preview">
        <video id="video" playsinline muted hidden></video>
        <img id="photo" alt="撮影した犬の写真" hidden />
        <div class="placeholder" id="placeholder">
          <span class="placeholder-icon">📷</span>
          <span>カメラで撮影するか、写真を選んでください</span>
        </div>
      </div>

      <div class="buttons">
        <button type="button" id="cameraBtn" class="btn primary">カメラを起動</button>
        <button type="button" id="shutterBtn" class="btn primary" hidden>📸 撮影する</button>
        <label class="btn secondary">
          写真を選ぶ
          <input type="file" id="fileInput" accept="image/*" capture="environment" hidden />
        </label>
      </div>
    </section>

    <section class="card status" id="status" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <div>
        <p id="statusText">準備中…</p>
        <div class="progress" id="progressWrap" hidden><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </section>

    <section class="card result" id="result" hidden aria-live="polite">
      <div class="result-main">
        <div class="result-emoji" id="resultEmoji"></div>
        <div>
          <p class="result-label">いまの気持ちは…</p>
          <h2 id="resultName"></h2>
          <p class="confidence" id="resultConfidence"></p>
        </div>
      </div>
      <p class="message" id="resultMessage"></p>
      <p class="advice" id="resultAdvice"></p>
      <p class="warning" id="resultWarning" hidden></p>

      <h3>感情の内訳</h3>
      <ul class="bars" id="bars"></ul>
    </section>

    <footer class="note">
      <p>
        ※ 画像は端末内だけで処理され、外部に送信されません（初回のみ AI モデル約 150MB をダウンロードします）。
        結果は表情からの推定でありあくまで目安です。しっぽ・体の姿勢・状況もあわせて判断し、
        体調の異変が気になる場合は獣医師に相談してください。
      </p>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
